name: Java CI with Gradle

on:
  workflow_dispatch:

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build (NeoForge)
        run: ./gradlew build
